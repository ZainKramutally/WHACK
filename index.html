<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%274%27 y=%274%27 width=%2724%27 height=%2724%27 rx=%274%27 fill=%27none%27 stroke=%27%2371d6b0%27 stroke-width=%273%27/%3E%3C/svg%3E" />
    <!-- Selection screen fonts (pixel-art paper look), self-hosted so the screen is identical offline (public/fonts, OFL). -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <title>Life is ▢ based</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }
      /* DOM overlay root: lets clicks through to the canvas; UI children opt in with pointer-events: auto. */
      #ui { position: fixed; inset: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
