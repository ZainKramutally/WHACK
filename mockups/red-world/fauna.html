<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Red World · fauna lab</title>
  <style>
    html, body { margin: 0; background: #fff; }
    canvas { display: block; }
    #info { position: fixed; right: 8px; bottom: 6px; font: 12px ui-monospace, monospace; color: #22060f; }
  </style>
</head>
<body>
  <div id="info"></div>
  <script type="module">
    // ?view=aquatic… opens the underwater swimmer lab (src/fauna/aquatic/lab.ts); every other view is the land lab
    if ((new URLSearchParams(location.search).get('view') ?? '').startsWith('aquatic')) import('/src/fauna/aquatic/lab.ts');
    else import('/src/fauna/lab.ts');
  </script>
</body>
